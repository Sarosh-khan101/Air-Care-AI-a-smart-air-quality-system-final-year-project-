<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Air-Care-AI | Sign Up</title>
    <link rel="stylesheet" href="/signup.css">
</head>
<body>

    <div class="container">

        <h1>
            Air-Care-AI : <span>[<u>Smart Air Quality & Health Advisory System</u>]</span>
        </h1>

        <div class="form-box">

            <h2><p class="title">Create Your Account</p></h2>

            <form id="entry-form"> 
  <div class="input-group">
                    <input type="text" required placeholder="Full Name" name="full_name">
                </div>

                <div class="input-group">
                    <input type="email" required placeholder="Email Address" name="e_mail">
                </div>

                  <div class="input-group">
                    <input type="password" required placeholder="Password" name="password" >
                </div>

                <div class="input-group">
                    <input type="tel" required placeholder="Phone Number" name="phone_number">
                </div>


                <div class="input-group">
                    <input type="date" required placeholder="Date of Birth" name="date_of_birth">
                </div>

                <div class="input-group">
                    <input type="text" required placeholder="City" name="city">
                </div>

                <div class="input-group">
                    <input type="number" required placeholder="Age" name="age">
                </div>

 <div class="signin-text">
              Let`s get started :
               <button type="submit">Create Account</button>
               </div>
            </form>
              <br>
           <form action="/signin" method="GET">
            <p>If already have account: <button type="submit">Sign In</button></p>
           </form>


<script src="signup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="chatbot.css">
</head>
<body>
    <header class="header">
            <h1 class="main-title"> Air-Care-AI : <u>[A Smart Air Quality & Health Advisory System]</u></h1>
        <h1 class="subtitle"><b>Smart Health Chatbot</b></h1>

            <nav class="navbar">
                <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="search.html">City Search</a></li>
            <li><a href="alerts.html">Health Alerts</a></li>
        </ul>
    </nav>

    <main class="chatbot-container">
        <section class="intro">
    <p><h2>Ask health related questions and get instant answers</h2></p>

    
        <div>
            <h4>Hello! I am your health assistant.
            How can i help you today?</h4>
        </div>
    </section>
    <section class="chat-box">
        <form class="chat-form">
        <label for="userQuestion">Type your question: </label>
        <input type="text" placeholder="Please ask your question" id="userQuestion" name="userQuestion">
        <button type="submmit" id="send-btn">Send</button>
        <p id="botResponse"></p>
        </form>
    </section>
    </main>
    <script src="chatbot.js"></script>
</body>
